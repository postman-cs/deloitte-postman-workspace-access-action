name: 'Deloitte: Postman Workspace Access'
description: Onboard detected GitHub collaborators into Postman and render Deloitte usage notifications.
author: Postman
branding:
  icon: users
  color: orange
inputs:
  workspace-id:
    description: ID of the Postman workspace created by the onboarding pipeline.
    required: true
  members-json:
    description: JSON array emitted by the GitHub scanner. Provide this or members-file.
    required: false
  members-file:
    description: Path to a JSON file emitted by the GitHub scanner. If omitted with members-json, the action auto-discovers a uniquely named scanner output.
    required: false
  config-file:
    description: Optional Deloitte configuration file. Defaults to .deloitte-postman.yml when present.
    required: false
  scanner-search-root:
    description: Root directory searched recursively when members-file and members-json are omitted.
    required: false
  identity-map-file:
    description: Optional JSON or login,email CSV mapping for scanner records that contain a GitHub login but no email.
    required: false
  invalid-member-policy:
    description: Continue valid onboarding while reporting unresolved scanner records, or fail before writes. Values are continue or fail.
    required: false
  exclude-bots:
    description: Exclude GitHub bot records from onboarding when true.
    required: false
  exclude-logins-json:
    description: JSON array of GitHub logins intentionally excluded from onboarding.
    required: false
  role-map-json:
    description: JSON overrides or extensions mapping GitHub permission names to Postman workspace role display names.
    required: false
  default-workspace-role:
    description: Inclusive fallback role assigned to detected collaborators with no explicit or mapped GitHub permission.
    required: false
  postman-api-key:
    description: Postman API key authorized for the target workspace. For system service accounts, pass the long-lived PMAK here and a freshly minted token in postman-access-token.
    required: true
  postman-access-token:
    description: Optional short-lived Postman system service-account access token used for API requests.
    required: false
  postman-scim-api-key:
    description: SCIM API key used to look up users and invite/provision users who are not on the team.
    required: false
  dry-run:
    description: Resolve and plan changes without creating users or assigning workspace roles.
    required: false
    default: 'false'
  fail-on-pending-invites:
    description: Fail when an invited user cannot receive a workspace role until they accept the team invite.
    required: false
    default: 'false'
  postman-base-url:
    description: Postman API base URL.
    required: false
    default: https://api.postman.com
  summary-file:
    description: Optional path where the complete JSON reconciliation summary is written for artifact upload.
    required: false
  postman-workspace-url:
    description: Workspace link placed in each rendered onboarding email. Defaults to the Postman home page.
    required: false
  source-repository:
    description: Repository name shown in onboarding emails. Defaults to the current GitHub repository.
    required: false
  notification-subject:
    description: Subject line for rendered onboarding emails.
    required: false
  notifications-file:
    description: Optional path where rendered plain-text and HTML onboarding emails are written as JSON.
    required: false
  notification-webhook-url:
    description: Optional HTTPS Deloitte mail-gateway endpoint that accepts a batch of rendered onboarding emails.
    required: false
  notification-webhook-token:
    description: Optional bearer token used only with the Deloitte notification webhook.
    required: false
outputs:
  summary-json:
    description: Machine-readable reconciliation summary.
  added-count:
    description: Number of users assigned a workspace role.
  invited-count:
    description: Number of missing users submitted to Postman SCIM for provisioning or invitation.
  pending-count:
    description: Number of invited users waiting before their workspace role can be assigned.
  skipped-count:
    description: Number of dry-run or otherwise skipped entries.
  failed-count:
    description: Number of failed entries.
  detected-count:
    description: Number of raw contributor records emitted by the scanner.
  resolved-count:
    description: Number of unique contributors eligible for Postman onboarding.
  unresolved-count:
    description: Number of scanner records requiring an email or role correction.
  excluded-count:
    description: Number of intentionally excluded scanner records.
  unresolved-json:
    description: Machine-readable unresolved scanner records with remediation reasons.
  scanner-source:
    description: Inline JSON or the resolved absolute scanner-output path used by the action.
  config-source:
    description: Resolved Deloitte configuration file, or built-in defaults.
  summary-file:
    description: Absolute path to the JSON summary file when summary-file is configured.
  notification-count:
    description: Number of onboarding email messages rendered from scanner results.
  notification-eligible-count:
    description: Number of rendered messages eligible for delivery (zero during dry-run previews).
  notification-delivered-count:
    description: Number of onboarding messages accepted by the configured notification gateway.
  notifications-file:
    description: Absolute path to the rendered onboarding-email JSON file when configured.
  metrics-json:
    description: Compact scanner, access, and notification adoption metrics.
runs:
  using: node24
  main: dist/index.cjs
