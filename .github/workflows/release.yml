name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: ${{ github.repository == 'postman-cs/deloitte-postman-workspace-access-action' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run qa
      - run: npm run verify:dist
      - name: Verify release version
        run: npm run release:verify -- "${GITHUB_REF_NAME}"
      - name: Build starter kit, package, SBOM, manifest, and checksums
        run: npm run release:assets

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*

      - name: Archive release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME} — Deloitte Postman workspace access"
