name: Deloitte Postman workspace access

on:
  workflow_call:
    inputs:
      workspace-id:
        description: Workspace created or reused by the Postman onboarding job.
        required: true
        type: string
      scanner-artifact:
        description: Optional artifact containing the GitHub scanner JSON. Leave empty when the file is already in the checkout.
        required: false
        default: ''
        type: string
      scanner-search-root:
        description: Directory containing the scanner output, or the destination for scanner-artifact.
        required: false
        default: .
        type: string
      apply:
        description: Apply changes. False performs a read-only preview.
        required: false
        default: false
        type: boolean
      fail-on-pending-invites:
        description: Fail the job while newly invited users are waiting to accept.
        required: false
        default: false
        type: boolean
      default-workspace-role:
        description: Fallback Postman role for any detected collaborator without a mapped permission.
        required: false
        default: Viewer
        type: string
      postman-workspace-url:
        description: User-facing URL placed in Deloitte onboarding emails.
        required: false
        default: https://go.postman.co/
        type: string
      notification-subject:
        description: Subject line used by Deloitte's mail gateway.
        required: false
        default: 'Deloitte: Your Postman workspace access'
        type: string
      artifact-retention-days:
        description: Number of days to retain the machine-readable reconciliation summary.
        required: false
        default: 30
        type: number
    secrets:
      POSTMAN_API_KEY:
        required: true
      POSTMAN_SCIM_API_KEY:
        required: true
      DELOITTE_NOTIFICATION_WEBHOOK_URL:
        required: false
      DELOITTE_NOTIFICATION_WEBHOOK_TOKEN:
        required: false
    outputs:
      summary-json:
        description: Machine-readable reconciliation summary.
        value: ${{ jobs.reconcile.outputs['summary-json'] }}
      pending-count:
        description: Invited users waiting before workspace access can be assigned.
        value: ${{ jobs.reconcile.outputs['pending-count'] }}
      failed-count:
        description: Failed reconciliation entries.
        value: ${{ jobs.reconcile.outputs['failed-count'] }}
      summary-artifact:
        description: Name of the uploaded reconciliation-summary artifact.
        value: ${{ jobs.reconcile.outputs['summary-artifact'] }}
      notification-count:
        description: Number of onboarding messages rendered for detected collaborators.
        value: ${{ jobs.reconcile.outputs['notification-count'] }}
      notification-delivered-count:
        description: Number of onboarding messages accepted by Deloitte's mail gateway.
        value: ${{ jobs.reconcile.outputs['notification-delivered-count'] }}

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    outputs:
      summary-json: ${{ steps.access.outputs['summary-json'] }}
      pending-count: ${{ steps.access.outputs['pending-count'] }}
      failed-count: ${{ steps.access.outputs['failed-count'] }}
      summary-artifact: ${{ steps.artifact_name.outputs.name }}
      notification-count: ${{ steps.access.outputs['notification-count'] }}
      notification-delivered-count: ${{ steps.access.outputs['notification-delivered-count'] }}
    steps:
      - name: Check out pipeline repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download GitHub scanner artifact
        if: ${{ inputs['scanner-artifact'] != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs['scanner-artifact'] }}
          path: ${{ inputs['scanner-search-root'] }}

      - name: Reconcile Deloitte workspace access
        id: access
        uses: ./.github/actions/deloitte-postman-workspace-access
        with:
          workspace-id: ${{ inputs['workspace-id'] }}
          scanner-search-root: ${{ inputs['scanner-search-root'] }}
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-scim-api-key: ${{ secrets.POSTMAN_SCIM_API_KEY }}
          default-workspace-role: ${{ inputs['default-workspace-role'] }}
          postman-workspace-url: ${{ inputs['postman-workspace-url'] }}
          notification-subject: ${{ inputs['notification-subject'] }}
          notification-webhook-url: ${{ secrets.DELOITTE_NOTIFICATION_WEBHOOK_URL }}
          notification-webhook-token: ${{ secrets.DELOITTE_NOTIFICATION_WEBHOOK_TOKEN }}
          dry-run: ${{ !inputs.apply }}
          fail-on-pending-invites: ${{ inputs['fail-on-pending-invites'] }}
          summary-file: .deloitte-postman/summary.json
          notifications-file: .deloitte-postman/notifications.json

      - name: Name summary artifact
        id: artifact_name
        if: ${{ always() && hashFiles('.deloitte-postman/summary.json') != '' }}
        shell: bash
        run: echo "name=deloitte-postman-workspace-access-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload reconciliation summary
        if: ${{ always() && hashFiles('.deloitte-postman/summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: .deloitte-postman/
          retention-days: ${{ inputs['artifact-retention-days'] }}
          if-no-files-found: error
